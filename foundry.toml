[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
# Robinhood Chain runs ArbOS 61 on both 4663 and 46630 (ArbSys.arbOSVersion() == 116),
# and PUSH0/MCOPY were verified live on both. See docs/benchmark.md.
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000000
# no trailing metadata: the "verifier has no admin path" test scans raw opcodes
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./test/vectors" }]
gas_reports = ["VRFVerifier", "VRFCoordinator", "Subscription"]

[invariant]
runs = 64
depth = 64
fail_on_revert = false
shrink_run_limit = 2000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
